[project]
name = "crypto"
version = "0.1.0"
description = "Crypto signal engine, paper-trade journal, and self-hosted signal dashboard"
readme = "README.md"
authors = [
    { name = "Shahmeeer", email = "faizalioffical355@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agno[mcp,openai]>=2.9.0",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pandas>=2.2",
    "python-dotenv>=1.0",
    "statsmodels>=0.14.6",
    "uvicorn>=0.30",
    "yfinance>=0.2.50",
]

[project.scripts]
crypto-mcp = "crypto.mcp_agent:main"
crypto-signals = "crypto.signal_agent:main"
crypto-dashboard = "crypto.app:main"
crypto-backtest = "crypto.backtest:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
